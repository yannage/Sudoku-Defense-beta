name: Build Sudoku Defense Godot

on:
  push:
    branches: [godot-deck-edition]
    paths: ['godot/**', '.github/workflows/godot.yml']
    tags: ['godot-v*']
  pull_request:
    paths: ['godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1
      - name: Install official Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 -O "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 -O "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 -O "$base/SHA512-SUMS.txt"
          grep -E "Godot_v${GODOT_VERSION}-stable_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum --check -
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" 'templates/web*' 'templates/linux*x86_64' 'templates/windows*x86_64*' 'templates/version.txt'
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import, export, validate Linux boot, and package
        run: python3 godot/scripts/build_exports.py --render-check
      - uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Defense-Godot-Web
          path: godot/build/web/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Defense-Godot-Desktop-and-Source
          path: godot/build/downloads/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sudoku-Defense-Godot-Build-Logs
          path: |
            godot/build/logs/
            godot/build/render-checks/
            godot/build/seed-checks/
            godot/build/health-checks/
            godot/build/tactics-checks/
            godot/build/readability-checks/
            godot/build/menu-checks/
            godot/build/controller-cursor-checks/
            godot/build/loot-gear-checks/
          retention-days: 14

  windows-smoke:
    needs: exports
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sudoku-Defense-Godot-Desktop-and-Source
          path: packages
      - name: Verify exported Windows startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $PWD 'packages/Sudoku-Defense-Godot-Windows.zip'
          Expand-Archive -Path $archive -DestinationPath windows-build
          $folder = (Resolve-Path windows-build).Path
          $exe = Join-Path $folder 'SudokuDefense.exe'
          $version = [regex]::Match((Get-Content godot/project.godot -Raw), '(?m)^config/version="([^"]+)"\r?$').Groups[1].Value
          if (-not $version) { throw 'Missing application version' }
          $process = Start-Process -FilePath $exe -WorkingDirectory $folder -ArgumentList @('--headless', '--audio-driver', 'Dummy', '--quit-after', '120', '--log-file', 'windows-smoke.log', '--', '--smoke-test') -Wait -PassThru
          $log = Get-Content (Join-Path $folder 'windows-smoke.log') -Raw
          Write-Host $log
          if ($process.ExitCode -ne 0 -or $log -match 'ERROR:|Parse Error:' -or -not $log.Contains("SUDOKU_DEFENSE_READY version=$version")) {
            throw "Windows startup failed with exit code $($process.ExitCode)"
          }
          @{
            source_commit = '${{ github.sha }}'
            game_version = $version
            status = 'passed'
            executable_sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            archive_sha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            ready_marker = "SUDOKU_DEFENSE_READY version=$version"
          } | ConvertTo-Json | Set-Content windows-startup-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sudoku-Defense-Windows-Startup-Validation
          path: |
            windows-startup-validation.json
            windows-build/windows-smoke.log
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/godot-v')
    needs: [exports, windows-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sudoku-Defense-Godot-Desktop-and-Source
          path: packages
      - name: Publish versioned game downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" packages/* --repo "${{ github.repository }}" --title "Sudoku Defense ${{ github.ref_name }}" --generate-notes
