<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07141c">
<meta name="description" content="Plant answers. Build a defense. Sudoku Defense is a voxel strategy game from YAK Studios.">
<title>Sudoku Defense · YAK Studios</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07141c;color:#edf4eb;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#launch{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#173b42 0,#091b26 48%,#06111a 100%);padding:24px;z-index:2}.card{width:min(430px,100%);text-align:center}.sigil{width:76px;height:76px;margin:0 auto 28px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;transform:rotate(-7deg)}.sigil i{background:#75e1be;box-shadow:3px 4px 0 #277e78}.sigil i:nth-child(3n){background:#edaa6b;box-shadow:3px 4px 0 #8b623f}.sigil i:nth-child(5){background:#dcebdc;box-shadow:3px 4px 0 #7b9d91}h1{font-size:clamp(36px,6vw,49px);font-weight:850;line-height:1;letter-spacing:-2px;margin:0 0 16px}.eyebrow{font-size:10px;letter-spacing:4px;color:#9cb4b8;text-transform:uppercase;margin:0 0 20px}.tagline{font-size:16px;color:#adc2c2;line-height:1.6;margin:0 0 30px}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;border-radius:10px;background:#edaa6b;color:#142831;font-size:14px;font-weight:800;letter-spacing:1.2px;padding:18px 32px;box-shadow:0 5px 0 #9e6544;min-width:240px;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.12);transform:translateY(-2px)}button:focus-visible{outline:3px solid #d9fff2;outline-offset:6px}button:disabled{cursor:wait;opacity:.8;transform:none}.desktop-link{display:inline-block;color:#9bc4be;text-decoration:none;font-size:12px;margin-top:17px;padding:7px}.desktop-link:hover{text-decoration:underline}.desktop-link:focus-visible{outline:2px solid #d9fff2;outline-offset:3px}.hint{font-size:11px;color:#779a9f;line-height:1.8;margin-top:28px}.progress{height:4px;width:240px;max-width:100%;margin:22px auto 0;background:#203f49;border-radius:4px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:#75e1be;transition:width .15s}#status{font-size:12px;color:#9cbbbd;min-height:34px;line-height:1.5;margin-top:12px}#brand{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;font-size:9px;letter-spacing:3px;color:#66898b;text-align:center}#launch.hidden{display:none}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Sudoku Defense game. Use arrow keys or a controller to select squares, and number keys to plant towers.">Your browser needs WebGL 2 to play Sudoku Defense.</canvas>
<div id="launch"><div class="card"><div class="sigil" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="eyebrow">Logic grows into firepower</p><h1>SUDOKU<br>DEFENSE</h1><p class="tagline">Plant your answers. Stack your towers.<br>Hold the grid.</p><button id="play">ENTER THE GRID ↗</button><div class="progress" aria-hidden="true"><i id="bar"></i></div><div id="status" role="status" aria-live="polite"></div><div class="hint">Controller · keyboard · touch<br>Best played in landscape.</div><a class="desktop-link" href="downloads.html">Get desktop builds ↗</a></div><div id="brand">YAK STUDIOS</div></div>
<script>
const WASM_PARTS=__WASM_PARTS__;
const WASM_BYTES=__WASM_BYTES__;
const originalFetch=window.fetch.bind(window);
let engineBytes;
// The engine is split solely to fit the static host's per-file limit. The
// Response contains the exact original Godot WASM bytes and MIME type.
window.fetch=async function(resource,options){
  const url=new URL(typeof resource==='string'?resource:resource.url,document.baseURI);
  if(url.origin===location.origin && url.pathname===new URL('index.wasm',document.baseURI).pathname){
    if(!engineBytes){
      engineBytes=Promise.all(WASM_PARTS.map(async part=>{
        const response=await originalFetch(new URL(part.name,document.baseURI),options);
        if(!response.ok)throw new Error('Could not download game engine. Please reload and try again.');
        const bytes=await response.arrayBuffer();
        if(bytes.byteLength!==part.bytes)throw new Error('The game download was incomplete. Please reload.');
        return bytes;
      })).then(parts=>new Blob(parts,{type:'application/wasm'}));
    }
    return new Response(await engineBytes,{status:200,headers:{'Content-Type':'application/wasm','Content-Length':String(WASM_BYTES)}});
  }
  return originalFetch(resource,options);
};
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG=__GODOT_CONFIG__;
const engine=new Engine(GODOT_CONFIG);
const play=document.getElementById('play');
const status=document.getElementById('status');
const bar=document.getElementById('bar');
let starting=false;
play.addEventListener('click',async()=>{
  if(starting)return;
  starting=true;play.disabled=true;play.textContent='GROWING THE GRID…';status.textContent='Preparing your defense';
  try{
    const missing=Engine.getMissingFeatures({threads:false});
    if(missing.length)throw new Error('This browser is missing '+missing.join(', ')+'. Try a current Chrome, Firefox, or Edge browser.');
    await engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{
      const fraction=total>0?current/total:0;
      bar.style.width=Math.round(Math.min(1,fraction)*100)+'%';
      status.textContent=fraction>.99?'Building the battlefield…':'Loading game '+Math.round(fraction*100)+'%';
    }});
    document.getElementById('launch').classList.add('hidden');
    document.getElementById('canvas').focus();
  }catch(error){status.textContent=error.message||String(error);play.textContent='TRY AGAIN';play.disabled=false;starting=false;engineBytes=undefined;console.error(error);}
});
</script>
</body>
</html>
